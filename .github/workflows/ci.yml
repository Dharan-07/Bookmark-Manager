name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookmark_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: bookmark_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bookmark_user:test_password@localhost:5432/bookmark_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client and apply migrations
        run: bun run gendb

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test
